# Reflex Rules Configuration
# Each rule is evaluated in priority order (lower number = higher priority).
# Format: YAML with fact predicates matching ReflexPredicate structure.
#
# IMPORTANT: All conflict_key values are empty string "" to bypass the
# action arbiter's conflict check. This allows multiple reflex actions
# to be queued simultaneously — a pro player doesn't wait for permission
# to potion when HP drops.

rules:
  - rule_id: emergency_heal_potion
    enabled: true
    priority: 5
    category: survival
    cooldown_ms: 1500
    circuit_breaker_key: combat.default
    trigger:
      all:
        - { fact: "vitals.hp_ratio", op: "lte", value: 0.35 }
        - { fact: "combat.is_in_combat", op: "eq", value: true }
    guards: []
    action:
      kind: command
      command: "use Red Potion"
      priority_tier: reflex
      conflict_key: ""
    fallback_macro: reflex_survival_heal

  - rule_id: lethal_escape_teleport
    enabled: true
    priority: 1
    category: survival
    cooldown_ms: 5000
    circuit_breaker_key: combat.default
    trigger:
      all:
        - { fact: "vitals.hp_ratio", op: "lte", value: 0.18 }
        - { fact: "combat.is_in_combat", op: "eq", value: true }
    guards: []
    action:
      kind: log
      command: "lethal_escape_pending"
      priority_tier: reflex
      conflict_key: ""
    fallback_macro: reflex_teleport_escape
    metadata:
      note: "Observability-only: the bridge's emergency-escape reflex owns actual teleport/flee; 'sit' is bridge-blocked."

  - rule_id: self_heal_skill
    enabled: true
    priority: 10
    category: survival
    cooldown_ms: 3000
    circuit_breaker_key: skill.default
    trigger:
      all:
        - { fact: "vitals.hp_ratio", op: "lte", value: 0.50 }
        - { fact: "vitals.sp_ratio", op: "gte", value: 0.20 }
        - { fact: "skills.heal", op: "gte", value: 1 }
    guards: []
    action:
      kind: command
      command: "ss heal"
      priority_tier: reflex
      conflict_key: ""

  - rule_id: agile_flee_many
    enabled: true
    priority: 8
    category: combat
    cooldown_ms: 2000
    circuit_breaker_key: combat.default
    trigger:
      all:
        - { fact: "combat.aggro_count", op: "gte", value: 4 }
        - { fact: "vitals.hp_ratio", op: "lte", value: 0.60 }
    guards: []
    action:
      kind: log
      command: "overwhelmed_flee_pending"
      priority_tier: reflex
      conflict_key: ""
    fallback_macro: reflex_flee_overwhelmed
    metadata:
      note: "Observability-only: bridge emergency-escape owns actual fleeing; 'sit' is bridge-blocked."

  - rule_id: safe_auto_resume
    enabled: true
    priority: 20
    category: interaction
    cooldown_ms: 5000
    circuit_breaker_key: movement.default
    trigger:
      all:
        - { fact: "vitals.hp_ratio", op: "gte", value: 0.70 }
        - { fact: "combat.is_in_combat", op: "eq", value: false }
        - { fact: "combat.aggro_count", op: "eq", value: 0 }
        - { fact: "ai.is_manual", op: "eq", value: true }
    guards: []
    action:
      kind: command
      command: "ai auto"
      priority_tier: reflex
      conflict_key: ""

  - rule_id: weight_warning
    enabled: true
    priority: 15
    category: interaction
    cooldown_ms: 60000
    circuit_breaker_key: inventory.default
    trigger:
      all:
        - { fact: "inventory.weight_ratio", op: "gte", value: 0.80 }
        - { fact: "combat.is_in_combat", op: "eq", value: false }
    guards: []
    action:
      kind: command
      command: "ai auto"
      priority_tier: reflex
      conflict_key: ""
    metadata:
      note: "Weight warning — let LLM plan vendor route. ai auto keeps bot safe while inventory fills."

  - rule_id: auto_pickup
    enabled: true
    priority: 25
    category: interaction
    cooldown_ms: 1000
    circuit_breaker_key: loot.default
    trigger:
      all:
        - { fact: "ground.nearby_items", op: "gte", value: 1 }
        - { fact: "combat.is_in_combat", op: "eq", value: false }
        - { fact: "inventory.weight_ratio", op: "lte", value: 0.85 }
    guards: []
    action:
      kind: command
      command: "take"
      priority_tier: reflex
      conflict_key: ""

  - rule_id: party_heal_ally
    enabled: true
    priority: 12
    category: survival
    cooldown_ms: 4000
    circuit_breaker_key: party.default
    trigger:
      all:
        - { fact: "party.lowest_hp_ratio", op: "lte", value: 0.40 }
        - { fact: "skills.heal", op: "gte", value: 1 }
        - { fact: "party.has_members", op: "eq", value: true }
    guards: []
    action:
      kind: log
      command: "party_heal_pending"
      priority_tier: reflex
      conflict_key: ""
    metadata:
      note: "Observability-only: 'ai manual' would DISABLE bot AI permanently (config-audit owns AI mode). The fleet coordinator + bridge dispatch real party heals."

  - rule_id: sit_recover
    enabled: true
    priority: 30
    category: survival
    cooldown_ms: 10000
    circuit_breaker_key: recovery.default
    trigger:
      all:
        - { fact: "vitals.hp_ratio", op: "lte", value: 0.60 }
        - { fact: "vitals.sp_ratio", op: "lte", value: 0.40 }
        - { fact: "combat.is_in_combat", op: "eq", value: false }
        - { fact: "combat.aggro_count", op: "eq", value: 0 }
        - { fact: "ai.is_sitting", op: "eq", value: false }
    guards: []
    action:
      kind: log
      command: "sit_recover_pending"
      priority_tier: reflex
      conflict_key: ""
    metadata:
      note: "Observability-only: 'sit' is bridge-blocked (bot should never sit); the bridge's emergency-sit reflex + pdca rest path handle recovery."

  - rule_id: aggro_attack
    enabled: true
    priority: 22
    category: combat
    cooldown_ms: 2000
    circuit_breaker_key: combat.default
    trigger:
      all:
        - { fact: "combat.aggro_count", op: "gte", value: 1 }
        - { fact: "combat.aggro_count", op: "lte", value: 3 }
        - { fact: "vitals.hp_ratio", op: "gte", value: 0.50 }
        - { fact: "ai.is_manual", op: "eq", value: false }
    guards: []
    action:
      kind: command
      command: "ai auto"
      priority_tier: reflex
      conflict_key: ""
    metadata:
      note: "Aggro present — ai auto handles auto-attack."

  - rule_id: mob_swarm_combat_stance
    enabled: true
    priority: 6
    category: combat
    cooldown_ms: 3000
    circuit_breaker_key: combat.default
    trigger:
      all:
        - { fact: "combat.aggro_count", op: "gte", value: 5 }
    guards: []
    action:
      kind: log
      command: "mob_swarm_stance_pending"
      priority_tier: reflex
      conflict_key: ""
    metadata:
      note: "Observability-only: 'ai manual' would DISABLE bot AI permanently; the tactics dispatcher owns combat stance."

  - rule_id: emergency_red_potion
    enabled: true
    priority: 3
    category: survival
    cooldown_ms: 2000
    circuit_breaker_key: combat.default
    trigger:
      all:
        - { fact: "vitals.hp_ratio", op: "lte", value: 0.25 }
        - { fact: "combat.is_in_combat", op: "eq", value: true }
    guards: []
    action:
      kind: command
      command: "use Orange Potion"
      priority_tier: reflex
      conflict_key: ""
