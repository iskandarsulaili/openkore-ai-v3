[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkore-ai-sidecar"
version = "0.1.0"
description = "Local OpenKore AI sidecar service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.51.0",
  "httpx>=0.28.0",
  "structlog>=26.1.0",
  "pydantic>=2.13.0",
  "pydantic-settings>=2.14.0",
  "scikit-learn>=1.9.0",
  "openmemory-py>=1.3.2",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "pyyaml>=6.0",
]

[project.scripts]
openkore-ai-sidecar = "ai_sidecar.app:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {where = ["."], include = ["ai_sidecar*"]}}
