[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openkore-ai-sidecar"
version = "0.1.0"
description = "Local OpenKore AI sidecar service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140.13",
  "uvicorn[standard]>=0.52.0",
  "httpx>=0.28.1",
  "structlog>=26.1.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "scikit-learn>=1.9.0",
  "orjson>=3.11.9",
  "pyyaml>=6.0.3",
  "python-multipart>=0.0.32",
  "openai>=2.50.0",
  "anthropic>=0.120.2",
]

[project.scripts]
openkore-ai-sidecar = "ai_sidecar.app:main"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {where = ["."], include = ["ai_sidecar*"]}}
